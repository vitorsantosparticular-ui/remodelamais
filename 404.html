<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Dra. Sónia Alexandra Santos, Advogada</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Marcellus&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .erro { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px 16px; }
    .erro__in { max-width: 560px; display: grid; justify-items: center; gap: 18px; }
    .erro__in img { width: 72px; }
    .erro__n { font: 400 clamp(5rem, 16vw, 8rem)/1 var(--serif); background: var(--ouro); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .erro h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); margin: 0; }
    .erro p { color: var(--suave); margin: 0; }
    .erro__acoes { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  </style>
</head>
<body>
  <main class="erro">
    <div class="erro__in">
      <img src="/img/monograma.png" alt="" width="233" height="220">
      <span class="erro__n">404</span>
      <h1>Esta página <em class="ouro-texto">não existe</em></h1>
      <p>O endereço pode estar errado ou a página pode ter mudado de lugar.</p>
      <div class="erro__acoes">
        <a href="/" class="btn btn--ouro"><span>Ir para o início</span></a>
        <a href="/consulta/" class="btn btn--linha"><span>Pedir marcação</span></a>
      </div>
    </div>
  </main>
</body>
</html>
